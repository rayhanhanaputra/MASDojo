objective: >
  VaultBank's dashboard computes a reward token at runtime but never renders it
  (only its length is logged). Decompile MASDojo.apk, find the method that
  computes it (DashboardActivity.computeReward), and write a Frida hook that wraps
  it and send()s its return value back - that is the only way to read the value.
  The grader checks your hook targets the right method and reports what it saw.
success_type: frida_assert
