[project]
name = "masdojo-runner"
version = "0.1.0"
description = "MASDojo grading runner: boots an Android AVD and evaluates submissions"
authors = [{ name = "Rayhan Hanaputra", email = "hanaputrarayhan@gmail.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy native deps only needed to drive a real device. The dry-run grader
# (flag/static_assert) does not import them, so they stay optional and the
# dry-run image installs the base package alone.
device = [
    # Pin below 17: Frida 17 removed the built-in `Java`/`ObjC` globals (moved to
    # separate bridge modules), which breaks every curriculum script using the
    # classic `Java.perform(...)` API. The whole lab targets the 16.x API.
    "frida>=16.4,<17",
    "frida-tools>=12.4,<13",
    "mitmproxy>=10.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "cryptography>=42.0",  # verifies the crypto tasks' ciphertext is genuinely solvable
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runner*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
