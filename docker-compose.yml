# MASDojo — one-command bring-up.
#
#   cp .env.example .env && docker compose up --build
#
# NOTE: the `runner` service boots an Android emulator and needs a KVM-enabled
# host. It maps /dev/kvm into the container. On hosts without /dev/kvm, comment
# out the runner service here and run it on bare metal (see docs/architecture.md).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-masdojo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masdojo}
      POSTGRES_DB: ${POSTGRES_DB:-masdojo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masdojo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      # Name of the shared lab container (SOLO mode). In hosted mode each
      # session gets its own ephemeral hardened container instead.
      LAB_CONTAINER: masdojo-lab-1
      # Host-side repo path + task-store volume name, so per-session `docker run`
      # can mount the committed targets (the daemon resolves -v sources on the
      # host, not inside this container).
      HOST_REPO_DIR: ${PWD}
      LAB_TASK_STORE_VOLUME: masdojo_task-store
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./tasks:/app/tasks:ro
      # The all-in-one target APK (built via `make apps`), served at /download/target-apk.
      - ./apps/vaultbank:/app/apps/vaultbank:ro
      # Writable store for instructor-authored / APK-overridden tasks.
      - task-store:/app/task-store
      # Docker socket so the terminal can exec into the isolated lab container.
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "python -m app.db.init_db &&
             python -m app.services.seeder &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite inlines VITE_API_BASE_URL at BUILD time, so it must be a build arg —
      # a runtime env is ignored. For a remote host set this to the public URL,
      # e.g. VITE_API_BASE_URL=http://<host-ip>:8000 before `docker compose build`.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "5173:5173"

  # Intentionally-vulnerable API — the live target for Lab 3 (IDOR + JWT
  # alg:none, tasks 071/072). Learners exploit it directly at http://localhost:8091.
  vulnapi:
    build:
      context: ./vulnapi
      dockerfile: Dockerfile
    ports:
      - "8091:8091"

  # Requires a KVM-enabled host. Comment out if /dev/kvm is unavailable and run
  # the runner on bare metal instead (docs/architecture.md#runner-on-bare-metal).
  runner:
    build:
      # Context is the repo root so the image can copy runner/ + infra/avd/.
      context: .
      dockerfile: runner/Dockerfile
    env_file: .env
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./tasks:/app/tasks:ro
      - runner-artifacts:/app/artifacts
      # Instructor-authored / APK-overridden tasks (read-only on the runner).
      - task-store:/app/task-store:ro
    devices:
      - "/dev/kvm:/dev/kvm"
    # Emulator needs more shared memory than the default 64MB.
    shm_size: "2gb"

  # Lightweight dry-run grader for hosts WITHOUT KVM (e.g. macOS). Grades
  # flag/static_assert tasks only. Not started by default — opt in with:
  #   docker compose --profile dryrun up -d runner-dryrun   (or: make runner-dryrun)
  runner-dryrun:
    build:
      context: .
      dockerfile: runner/Dockerfile.dryrun
    profiles: ["dryrun"]
    env_file: .env
    environment:
      RUNNER_DRY_RUN: "true"
      REDIS_HOST: redis
      POSTGRES_HOST: db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./tasks:/app/tasks:ro
      - runner-artifacts:/app/artifacts
      - task-store:/app/task-store:ro

  # Isolated lab workstation: the in-browser terminal execs a shell in HERE, so
  # a learner shell carries the pentest toolchain but none of the backend
  # secrets. Opt in with: docker compose --profile lab up -d --build lab
  lab:
    build:
      context: .
      dockerfile: infra/Dockerfile.lab
    profiles: ["lab"]
    # Deliberately NO env_file: this container must not see backend secrets.
    # Point adb at the host's adb server so the terminal can drive the host's
    # emulator. On a KVM runner, set this to the runner's adb instead. Start the
    # host server on all interfaces first: `adb -a -P 5037 nodaemon server`.
    environment:
      ADB_SERVER_SOCKET: tcp:host.docker.internal:5037
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sleep", "infinity"]
    volumes:
      # Sibling mounts under /targets (not /targets itself, which would make the
      # parent read-only and block the nested mounts).
      - ./apps/vaultbank:/targets/app:ro
      - ./tasks:/targets/tasks:ro
      - task-store:/targets/task-store:ro
      - lab-work:/work

volumes:
  postgres-data:
  redis-data:
  runner-artifacts:
  task-store:
  lab-work:
