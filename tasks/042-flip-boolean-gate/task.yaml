objective: >
  VaultBank's premium feature is gated by a single client-side boolean,
  FeatureGate.isUnlocked(), which always returns false. Write a Frida hook that
  forces it to return true so the gated reward unlocks. The runner confirms the
  gate was locked at baseline and unlocked only after your hook.
