id: 072-broken-auth-token-forgery
title: Broken Auth / Token Forgery
module: '7'
order_index: 2
domain: api-dynamic
masvs:
- MASVS-AUTH-1
- MASVS-AUTH-2
mastg_refs:
- MASTG-TECH-0011
difficulty: 4
prereqs:
- 071-idor-backend
objective: >
  VaultBank's live API (http://localhost:8091) issues you a normal user JWT, and
  /admin returns 403. But the server's verifier trusts the token's header 'alg'.
  Forge an unsigned admin token (alg:none, role=admin), use it to reach the admin
  ledger, and recover its flag. The flag is not in any file — you forge and exploit.
success_type: network_assert
submission_schema:
  value: string
time_estimate_min: 40
