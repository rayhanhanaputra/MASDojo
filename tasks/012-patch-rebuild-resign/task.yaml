id: 012-patch-rebuild-resign
title: Patch, Rebuild & Resign
module: '1'
order_index: 3
domain: static-re
masvs:
- MASVS-CODE
- MASVS-RESILIENCE-1
mastg_refs:
- MASTG-TECH-0004
difficulty: 2
prereqs:
- 011-hidden-endpoint-smali
objective: >
  VaultBank's premium ledger is gated by a single client-side boolean
  (DashboardActivity.isPremiumUser, always false). Decompile MASDojo.apk to smali,
  flip that method so it returns true, repack with apktool, re-sign (a debug key
  is fine), and UPLOAD your patched build. The runner installs it and checks the
  premium path actually unlocks at runtime - so recovering the flag statically
  won't pass; you have to really patch, rebuild, and re-sign.
success_type: patch_assert
submission_schema:
  apk: file
time_estimate_min: 30
is_reference: false
grader_status: implemented
