objective: >
  You're given the decompiled source and a query dump for a content provider that
  is exported to every app on the device. From the provided provider_dump.txt and
  decompiled source, recover the sensitive value it leaks - it's stored encoded,
  not encrypted, so you'll decode the value from the dump rather than reading it
  straight off.
