id: 021-secrets-in-prefs
title: Secrets in SharedPreferences/SQLite
module: '2'
order_index: 1
domain: storage
masvs:
- MASVS-STORAGE-1
mastg_refs:
- MASTG-TECH-0019
difficulty: 2
prereqs:
- 001-find-hardcoded-secret
objective: >
  During your assessment of VaultBank you pull the app's private storage. It
  caches a session token in shared_prefs for "convenience" — but only
  base64-encoded, which is not encryption. Find the encoded value in the prefs XML
  and decode it to recover the token.
