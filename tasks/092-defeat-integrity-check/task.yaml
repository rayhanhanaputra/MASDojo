id: 092-defeat-integrity-check
title: Defeat Integrity/Tamper Check
module: '9'
order_index: 3
domain: rasp-bypass
masvs:
- MASVS-RESILIENCE-4
mastg_refs:
- MASTG-TECH-0049
difficulty: 5
prereqs:
- 009-root-detection-bypass
- 041-hook-method-runtime-flag
objective: >
  Before unlocking a reward, VaultBank verifies its own signing certificate
  against a hardcoded digest - on the training build (and any re-signed/tampered
  build) that check fails, so the reward stays locked. The whole integrity
  verdict is one in-process boolean: write a Frida hook that forces
  IntegrityChecker.isValidSignature() to return true, so the guarded reward is
  revealed. The runner confirms the check was locked at baseline and unlocked by
  your hook.
success_type: frida_assert
submission_schema:
  script: string
time_estimate_min: 45
is_reference: false
grader_status: implemented
app_package: "org.masdojo.vaultbank"
