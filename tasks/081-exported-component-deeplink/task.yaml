objective: >
  You're given a decompiled screen that should only appear after login. From the
  provided AndroidManifest.xml excerpt and decompiled activity, show the activity
  is exported with a deep link and no caller check - so it could be launched
  directly, skipping auth - and recover the value that screen reveals. The code
  obfuscates it rather than storing it in the clear, so you'll reconstruct it
  statically from the decompiled activity.
