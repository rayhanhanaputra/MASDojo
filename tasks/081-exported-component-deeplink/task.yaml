objective: >
  VaultBank has a screen that should only appear after login. On this engagement
  you notice an activity is exported with a deep link and no caller check — so it
  can be launched directly, skipping auth. Confirm it's reachable and recover the
  value that screen reveals; the app obfuscates it in code rather than storing it
  in the clear, so you'll reconstruct it from the decompiled activity.
