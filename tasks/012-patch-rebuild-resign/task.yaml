difficulty: 2
prereqs:
- 011-hidden-endpoint-smali
objective: >
  VaultBank's premium ledger is gated by a single client-side boolean
  (DashboardActivity.isPremiumUser, always false). Decompile MASDojo.apk to smali,
  flip that method so it returns true, repack with apktool, re-sign, install the
  patched build, open the premium ledger, and submit the flag it reveals. (A debug
  re-sign is fine - the point is that a client-side gate can't protect anything.)
success_type: flag
submission_schema:
  flag: string
time_estimate_min: 30
is_reference: false
grader_status: implemented
