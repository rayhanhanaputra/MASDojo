id: 071-idor-backend
title: IDOR on the Backend
module: '7'
order_index: 1
domain: api-dynamic
masvs:
- MASVS-AUTH-1
mastg_refs:
- MASTG-TECH-0011
difficulty: 4
prereqs:
- 005-intercept-api-call
objective: >
  VaultBank's app talks to its live backend at http://localhost:8091. You've
  captured the request that loads your own order — the order id is a direct object
  reference, and the server never checks the order belongs to you. Log in, tamper
  the id to read another customer's order, and recover the flag it holds. The flag
  is not in any file — you must exploit the running API.
success_type: network_assert
submission_schema:
  value: string
time_estimate_min: 40
is_reference: false
grader_status: implemented
