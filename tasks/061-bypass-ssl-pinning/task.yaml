id: 061-bypass-ssl-pinning
title: Bypass SSL Pinning
module: '6'
order_index: 1
domain: rasp-bypass
masvs:
- MASVS-NETWORK-2
- MASVS-RESILIENCE-1
mastg_refs:
- MASTG-TECH-0012
difficulty: 4
prereqs:
- 041-hook-method-runtime-flag
- 005-intercept-api-call
objective: >
  VaultBank pins its server certificate and refuses to proceed when the presented
  certificate doesn't match the pin (as happens behind any intercepting proxy).
  The pin is enforced by OkHttp's CertificatePinner.check(). Write a Frida hook
  that neutralises CertificatePinner.check so it no longer throws - defeating the
  pinning - and the protected feature unlocks. The runner confirms the pin
  rejected the connection at baseline and accepted it only after your hook.
success_type: frida_assert
submission_schema:
  script: string
time_estimate_min: 40
is_reference: false
grader_status: implemented
app_package: "org.masdojo.vaultbank"
