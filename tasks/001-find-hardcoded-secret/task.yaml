id: "001-find-hardcoded-secret"
title: "Find the Hardcoded API Secret"
module: "1"
order_index: 1
domain: "static-re"
masvs: ["MASVS-STORAGE-1"]

mastg_refs: ["MASTG-TECH-0023"]  # "Reviewing decompiled Java/Kotlin code"
difficulty: 1
prereqs: ["000-apk-anatomy-recon"]
objective: >
  Download the target app (MASDojo.apk) from this page. It talks to a backend
  using an API key that the developers hardcoded into the binary. Decompile the
  APK with jadx, find the embedded key, and submit it to prove you recovered it.
success_type: "static_assert"
submission_schema:
  value: "string"   # the recovered API key, e.g. msd_live_sk_xxxxxxxx
time_estimate_min: 20
is_reference: true
grader_status: "implemented"
app_package: "org.masdojo.securenotes"
launch_activity: ".MainActivity"
