id: 041-hook-method-runtime-flag
title: Hook a Method to Reveal a Runtime Flag
module: '4'
order_index: 1
domain: rasp-bypass
masvs:
- MASVS-RESILIENCE-1
mastg_refs:
- MASTG-TECH-0043
difficulty: 3
prereqs:
