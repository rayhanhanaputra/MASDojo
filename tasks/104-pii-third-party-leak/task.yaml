id: "104-pii-third-party-leak"
title: "PII Leaked to a Third-Party SDK"
module: "10"
order_index: 1
domain: "privacy"
masvs: ["MASVS-PRIVACY-1"]
mastg_refs: ["MASTG-TEST-0206"]  # Determining Whether Sensitive Data Is Sent to Third Parties
difficulty: 3
prereqs: ["021-secrets-in-prefs"]
objective: >
  On startup VaultBank fires off several requests — to its own backend and to
  third-party SDKs (ads, analytics). One of the third-party trackers exfiltrates
  the user's email, and it's encoded in the body. Triage the capture: tell
  first-party from third-party hosts, find the request leaking PII, and decode it
  to recover the exact email that left the device.
success_type: "static_assert"
submission_schema:
  value: string   # the leaked PII value
time_estimate_min: 25
is_reference: false
grader_status: "implemented"
