id: 084-confused-deputy-privesc
title: Confused-Deputy Privilege Re-Delegation
module: '8'
order_index: 4
domain: platform
masvs:
- MASVS-PLATFORM-1
mastg_refs:
- MASTG-TECH-0029
difficulty: 3
prereqs:
- 081-exported-component-deeplink
objective: >
  You're given a decompiled "privilege helper" broadcast receiver that mints an
  elevation grant - and the manifest entry for it. From the provided
  AndroidManifest.xml and decompiled/GrantReceiver.java, show it is exported with
  no permission and never checks who called it, so any app (or a shell broadcast)
  could invoke the protected action and obtain an effect it shouldn't - then
  recover the elevation grant it hands out. The code obfuscates the grant rather
  than returning it in the clear, so reconstruct it statically by replaying the
  receiver's own decode on your seeded values.
